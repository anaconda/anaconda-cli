[package]
name = "ana"
version = "0.0.0" # Placeholder - actual version derived from git tags via build.rs
edition = "2024"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rlimit = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Enforce the patched WebPKI minimum for reqwest's Linux certificate verifier.
rustls-webpki = "0.103.16"

[features]
# Diagnostics (Sentry) is opt-in. Enable with `cargo build --features diagnostics`.
# Unstable features are hidden and disabled by default.
# self-update: Enable `ana self update` command. Included by default.
# tool-install: Enable `ana tool install/uninstall` commands. Included by default.
#   Pulls in rattler for lockfile-based and solve-at-install-time installation.
# conda-package: Build for distribution as a conda package. Implicitly disables
#   self-update and tool-install (both managed by conda), and resolves binaries
#   from $CONDA_PREFIX/bin/.
default = ["self-update", "tool-install"]
diagnostics = ["dep:sentry"]
unstable = []
self-update = []
tool-install = [
    "dep:rattler",
    "dep:rattler_cache",
    "dep:rattler_conda_types",
    "dep:rattler_lock",
    "dep:rattler_repodata_gateway",
    "dep:rattler_solve",
    "dep:rattler_virtual_packages",
]
conda-package = []

[dependencies]
anaconda-anon-usage = { version = "0.8.0-pre.9", features = ["rattler", "reqwest"] }
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3"
dirs = "6"
figment = { version = "0.10", features = ["env"] }
http = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
console = "0.16"
indicatif = "0.18"
log = "0.4"
miette = { version = "7.6", features = ["fancy"] }
rattler = { version = "0.47", default-features = false, features = ["indicatif"], optional = true }
rattler_cache = { version = "0.10", default-features = false, optional = true }
rattler_conda_types = { version = "0.48", default-features = false, optional = true }
rattler_lock = { version = "0.31", default-features = false, optional = true }
# Pinned to the releases built against rattler_conda_types 0.48; bump with the rest of the rattler group.
rattler_repodata_gateway = { version = "=0.30.1", default-features = false, features = ["gateway", "indicatif"], optional = true }
rattler_solve = { version = "7.2", default-features = false, features = ["resolvo"], optional = true }
rattler_virtual_packages = { version = "=3.0.4", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "stream", "multipart", "native-tls"] }
reqwest-middleware = { version = "0.5", features = ["json", "form", "query"] }
rpassword = "7"
self-replace = "1.5"
sentry = { version = "0.49", optional = true }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.0"
toml_edit = "0.25"
# Requires a release containing Configuration::set_http_client.
anaconda-otel-rs = "0.1.2"
thiserror = "2"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
webbrowser = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
opentelemetry = "0.32.0"
owo-colors = { version = "4", features = ["supports-colors"] }
url = "2.5.8"
jsonc-parser = { version = "0.33.2", features = ["cst", "serde", "serde_json"] }

[dev-dependencies]
serial_test = "3"
temp-env = "0.3"
tempfile = "3"
wiremock = "0.6"

[build-dependencies]
cfg_aliases = "0.2.1"
