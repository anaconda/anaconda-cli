package:
  name: anaconda-cli
  version: ${{ env.get("PKG_VERSION") | default("0.0.0") }}

source:
  path: ..

build:
  number: 0
  # The binary is pre-built by CI before rattler-build runs.
  # build.sh/build.bat use $RECIPE_DIR to find the pre-built binary at
  # target/conda-package/release/ (separate target dir so the conda build
  # never clobbers the standalone target/release binary).

requirements:
  run:
    - anaconda-audit
    - anaconda-auth
    - anaconda-client
    - anaconda-env-log
    - anaconda-mcp
    - anaconda-repo-cli

about:
  homepage: https://github.com/anaconda/ana-cli
  license: Apache-2.0
  summary: A Single Entry Point for Data Science, ML, & AI-powered Applications
