name: CI

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment to use
        type: string
        default: dev
      skip-tests:
        description: Whether to skip tests
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    environment:
      # Only deploy when calling this workflow via pushes to main or releases
      # Otherwise, pull requests will be cluttered with deployment messages
      deployment: ${{ github.event_name == 'workflow_call' }}
      name: ${{ inputs.environment || 'dev' }}
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read   # To access the Vault
      id-token: write  # Required to authenticate with Azure via OIDC
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    defaults:
      run:
        # Use native shells unless bash is necessary.
        # Prefer PowerShell 5 on Windows since this is the default version.
        shell: ${{ startsWith(matrix.os, 'windows-') && 'powershell' || 'bash' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Real-time malware scanning dominates MSVC builds and the many
      # short-lived test processes on Windows runners. The temp-dir
      # exclusions matter for the integration tests: bootstrap/installer
      # tests write and execute binaries under %TEMP% (pytest tmp_path),
      # which would otherwise be scanned on every write and launch.
      - name: Configure Defender exclusions (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$(Get-Location)"
          Add-MpPreference -ExclusionPath "$env:TEMP"
          Add-MpPreference -ExclusionPath "$env:TMP"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "link.exe"
          Add-MpPreference -ExclusionProcess "python.exe"
          Add-MpPreference -ExclusionProcess "conda.exe"
          Add-MpPreference -ExclusionProcess "pwsh.exe"

      - name: Fetch CI secrets from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          exportEnv: false
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ANACONDA_CLI_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ANACONDA_CLI_CLIENT_SECRET }}
          method: jwt
          namespace: admin
          role: ${{ secrets.VAULT_ROLE }}
          url: ${{ secrets.EXT_VAULT_ADDR }}
          secrets: |
            anaconda-cli/${{ inputs.environment || 'dev' }}/data/ci ana_test_api_key | ana-test-api-key ;
            anaconda-cli/${{ inputs.environment || 'dev' }}/data/ci sentry_dsn | sentry-dsn

      # No DSN hash needed in the key: build.rs declares
      # rerun-if-env-changed=SENTRY_DSN, so a DSN change only rebuilds the
      # crates depending on it instead of invalidating the whole cache.
      - name: Cache Cargo registry and build
        if: ${{ github.event_name != 'workflow_call' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Set up ana with pixi
        uses: anaconda/actions/setup-anaconda-cli@a6f488910b4a1e4f3fe01736241ca1b92b4b355a # v0.3.1
        with:
          version: v0.1.6
          tools: pixi

      - name: Run unit tests
        if: ${{ !inputs.skip-tests }}
        env:
          RUST_BACKTRACE: 1
          SENTRY_DSN: ${{ steps.vault.outputs.sentry-dsn }}
        run: pixi run test-release

      - name: Test conda-package feature build
        if: ${{ !inputs.skip-tests }}
        env:
          RUST_BACKTRACE: 1
        # Separate target dir: a conda-package build must never clobber
        # target/release/ana, which the integration tests below rely on.
        run: |
          pixi run check-minimal
          pixi run test-conda-package

      - name: Pre-compile shim for signing (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: pixi run build-shim

      - name: Sign shim (Windows)
        if: ${{ runner.os == 'Windows' }}
        id: sign-shim
        uses: ./.github/actions/sign-windows
        with:
          binary-path: target/shim/shim.exe
          vault-cf-client-id: ${{ secrets.CF_ANACONDA_CLI_CLIENT_ID }}
          vault-cf-client-secret: ${{ secrets.CF_ANACONDA_CLI_CLIENT_SECRET }}
          vault-mount: ${{ inputs.environment || 'dev' }}
          vault-role: ${{ secrets.VAULT_ROLE }}
          vault-url: ${{ secrets.EXT_VAULT_ADDR }}

      - name: Build release binary
        env:
          SENTRY_DSN: ${{ steps.vault.outputs.sentry-dsn }}
          WINDOWS_SHIM_PATH: ${{ runner.os == 'Windows' && 'target/shim/shim.exe' || '' }}
        run: pixi run build-release

      - name: Sign binary (Windows)
        if: ${{ runner.os == 'Windows' }}
        id: sign-windows
        uses: ./.github/actions/sign-windows
        with:
          binary-path: target/release/ana.exe
          vault-cf-client-id: ${{ secrets.CF_ANACONDA_CLI_CLIENT_ID }}
          vault-cf-client-secret: ${{ secrets.CF_ANACONDA_CLI_CLIENT_SECRET }}
          vault-mount: ${{ inputs.environment || 'dev' }}
          vault-role: ${{ secrets.VAULT_ROLE }}
          vault-url: ${{ secrets.EXT_VAULT_ADDR }}

      - name: Sign and notarize binary (macOS)
        if: ${{ runner.os == 'macOS' }}
        id: sign-notarize-macos
        uses: ./.github/actions/sign-notarize-macos
        with:
          binary-path: target/release/ana
          vault-cf-client-id: ${{ secrets.CF_ANACONDA_CLI_CLIENT_ID }}
          vault-cf-client-secret: ${{ secrets.CF_ANACONDA_CLI_CLIENT_SECRET }}
          vault-mount: ${{ inputs.environment || 'dev' }}
          vault-role: ${{ secrets.VAULT_ROLE }}
          vault-url: ${{ secrets.EXT_VAULT_ADDR }}

      # Build the conda package before the integration tests so that the
      # conda_package session fixture reuses it from output/ instead of
      # silently rebuilding it (binary + rattler-build + conda create) in the
      # middle of the pytest run, where its cost is invisible in step timings.
      - name: Build conda package
        env:
          SENTRY_DSN: ${{ steps.vault.outputs.sentry-dsn }}
        run: pixi run build-conda

      - name: Run integration tests
        if: ${{ !inputs.skip-tests }}
        env:
          ANA_SENTRY_ENVIRONMENT: integration-test
          # Disable Sentry for pre-merge builds (PRs, merge queue) to avoid polluting error tracking
          ANA_SENTRY_DISABLED: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
          # API key for tests requiring real authentication (pixi, uv, pip feature tests)
          ANA_TEST_API_KEY: ${{ steps.vault.outputs.ana-test-api-key }}
          CERTIFICATE_TRUSTED: ${{ inputs.environment == 'prod' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CERTIFICATE_FINGERPRINT: ${{ steps.sign-notarize-macos.outputs.fingerprint }}
          MACOS_DEVELOPER_ID: ${{ steps.sign-notarize-macos.outputs.developer-id }}
          SENTRY_DSN: ${{ steps.vault.outputs.sentry-dsn }}
          WINDOWS_CERTIFICATE_FINGERPRINT: ${{ steps.sign-windows.outputs.fingerprint }}
        run: pixi run test-integration

      - name: Upload conda package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conda-package-${{ matrix.os }}
          path: output/
          retention-days: 7

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.os }}
          path: target/release/ana${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 7

  check:
    name: Check
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether all jobs succeeded
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
